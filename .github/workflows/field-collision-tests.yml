name: Field collision repair tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/field-collision-tests.yml"
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/field-collision-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
